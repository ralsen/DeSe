        __Devider:
            DIV_DATA: "- - - - >"
        name:                   # this is the full name "Devicename+MAC"
        hostname:               # this is the Devicename only, given by user    
        IP: 
            CSV_MODE: 'CHANGE'
        Architecture: 
            CSV_MODE: 'CHANGE'
        Type:
            CSV_MODE: 'CHANGE'
        Version: 
            CSV_MODE: 'CHANGE'
