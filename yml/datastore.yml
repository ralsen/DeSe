                - [MAC, MAC, CURRENT_DATA]
                - [TransmitCycle, TransmitCycle, CURRENT_DATA]
                - [MeasuringCycle, MeasuringCycle, CURRENT_DATA]
                - [Hash, Hash, CURRENT_DATA]
                - [Size, Size, CURRENT_DATA]
