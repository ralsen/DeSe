weather:
  category: weather                 # to witch category the device belongs to. this is used for grouping devices together.
  split:
    # put channels int separate graphs [graph_name, channel_0, channel_1, ...channel_n]
    - [weather_temp, channel_0, channel_1, channel_2, channel_3]
    - [weather_humidity, channel_4]
    - [weather_pressure, channel_5]
    - [weather_windspeed, channel_6]
    - [weather_winddirection, channel_7]
  TimeText:
    - [4, hour]
    - [1, day]
    - [1, week]
    - [1, month]
    - [1, year]
    - [10, year]
  channel_0:    
