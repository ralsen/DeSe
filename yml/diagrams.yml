# -----------------------------------------------------------------------------------------------------------------
#   diagrams.ynl contains information for rrdtool graph command. this is used to create graphs for various sensors 
#   and devices. the configuration is structured in a way that allows for easy management of different devices 
#   and their respective channels.
#   Diagram configuration for various sensors and devices
#   Each device has its own section with channels and their properties.
#   The configuration includes time intervals for data collection and display.
#   The channels are defined with their IDs, names, data sources, colors, and units.
#
#   "TimeText" it is a list used to specify the time interval which is displayed
#               in the graphs. Each entry is a list with two elements: the number of units and the type of unit.
#               the type of unit can be 'hour', 'day', 'week', 'month', 'year'. They are the same as the time value 
#               of the rrdtool-command.
#   
#   the name of the graphic-file is a combination of the device name and the time interval. e.g.
#   'Buero-68C63A87FACE_1_day' for the device 'Buero-68C63A87FACE' with a time interval of 1 day.
#   'Buero-68C63A87FACE_4_hour' for the device 'Buero-68C63A87FACE' with a time interval of 4 hours etc.

#   "channel_x" defines the channels for each device. Each channel has its own properties like ID, Name, rrd_DS, color and Unit.
#     "ID" is the unique identifier for the channel, which is used to fetch the data from the RRD file. 
#     "Name" is the name of the channel that is displayed in the graph. 
#     "rrd_DS" is the data source name in the RRD file. 
#     "color" is the color of the line in the graph. 
#     "Unit" is the unit of measurement for the channel, which is displayed on the vertical axis of the graph.
#   
#   "category" is used to group different devices together. This can be useful for organizing the graphs and making it easier to find specific devices.
#
#   the file type is png.
#   
#   if there are several data in one rrd that should be displayed in separately graphs,
#   the 'split' section is used to separate different data types for easier management.
#   split is a list of graphs name and a list of channels that should be displayed in this graph.
# -----------------------------------------------------------------------------------------------------------------
