    color: '#0000FF'                # color of the line in the graph.
    Unit: °C                        # unit of measurement for the channel, which is displayed on the legend of the graph.
  channel_2:
    ID: temperatur_max              # identifier for the channel, if False = ignore this channel else for future use
    Name: Temperatur max            # name of the channel that is to be displayed in the legend of the graph.
    rrd_DS: chan2                   # data source name in the RRD file. this is used to fetch the data for this channel from the RRD file.
    color: '#FF0000'                # color of the line in the graph.
    Unit: °C                        # unit of measurement for the channel, which is displayed on the legend of the graph.
  channel_3:
    ID: feels_like                  # identifier for the channel, if False = ignore this channel else for future use    
    Name: Feels like                # name of the channel that is to be displayed in the legend of the graph.
    rrd_DS: chan3           
    color: '#FFA500'                # color of the line in the graph.
    Unit: °C                        # unit of measurement for the channel, which is displayed on the legend of the graph.
  channel_4:
    ID: humidity                    # identifier for the channel, if False = ignore this channel else for future use             
    Name: Humidity                  # name of the channel that is to be displayed in the legend of the graph.
    rrd_DS: chan4                   # data source name in the RRD file. this is used to fetch the data for this channel from the RRD file.
    color: '#FF00A5'                # color of the line in the graph.
    Unit: '%'                       # unit of measurement for the channel, which is displayed on the legend of the graph.
  channel_5:
    ID: pressure                    # identifier for the channel, if False = ignore this channel else for future use
    Name: Pressure      
    rrd_DS: chan5                   # data source name in the RRD file. this is used to fetch the data for this channel from the RRD file.
    color: '#A500FF'                # color of the line in the graph.  
    Unit: hPa                       # unit of measurement for the channel, which is displayed on the legend of the graph.
  channel_6:
    ID: windspeed                   # identifier for the channel, if False = ignore this channel else for future use
    Name: Windspeed                 # name of the channel that is to be displayed in the legend of the graph.
    rrd_DS: chan6                   # data source name in the RRD file. this is used to fetch the data for this channel from the RRD file.
