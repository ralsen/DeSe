# -----------------------------------------------------------------------------------------------------------------
# ---------------------------------------------------------
# Basisbefehl
# ---------------------------------------------------------
base_cmd:
  - rrdtool
  - graph
  - "{pic_path}/{node}_{time_text}.png"
  - -t
  - "{node} ({time_text})"
  - --vertical-label
  - "{unit}"
  - -s
  - "now - {time_count} {time_unit}"
  - -e
  - now
  - -w
  - "1000"
  - -h
  - "300"
  - --full-size-mode
  - --border
  - "0"
  - --color
  - "BACK#FFFFFF"
  - --color
  - "CANVAS#FFFFFF"
  - --color
  - "GRID#DDDDDD"
  - --color
  - "MGRID#BBBBBB"
  - --color
  - "AXIS#666666"
  - --color
  - "FONT#000000"
  - --grid-dash
  - "1:3"
  - --font
  - "TITLE:12:Arial"
  - --font
  - "AXIS:10:Arial"
  - --font
  - "LEGEND:9:Arial"

# ---------------------------------------------------------
# Definitionen
# ---------------------------------------------------------
base_def:
  - "DEF:{rrd_DS}={rrd_path}/{orgnode}.rrd:{rrd_DS}:AVERAGE"

base_vdef:
  - "VDEF:{rrd_DS}_av={rrd_DS},AVERAGE"
  - "VDEF:{rrd_DS}_ma={rrd_DS},MAXIMUM"
  - "VDEF:{rrd_DS}_mi={rrd_DS},MINIMUM"
  - "VDEF:{rrd_DS}_ak={rrd_DS},LAST"

base_comment:
  - 'COMMENT:                         Durchschnitt   Maximum   Minimum    aktuell'

base_line:
  - 'LINE1:{rrd_DS}{color}:{name}{spaces}'

base_area:
  - 'AREA:{rrd_DS}{color}:{name}{spaces}'

base_gprint:
  - 'GPRINT:{rrd_DS}_av:%8.2lf'
  - 'GPRINT:{rrd_DS}_ma:%8.2lf'
  - 'GPRINT:{rrd_DS}_mi:%8.2lf'
  - 'GPRINT:{rrd_DS}_ak:%8.2lf'

base_cdef:
  - CDEF:{CDEF}

